<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Apple App / PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tuner & Metro">
  
  <title>Trombone Tuner & Metronome</title>
  <style>
    /* --- Cyberpunk / 2000s Hacker Style --- */
    :root {
      --bg-color: #020502;
      --text-green: #00ff41;
      --border-green: #008f11;
      --sharp-pink: #ff1493;
      --flat-orange: #ff8c00;
      --glow: 0 0 10px rgba(0, 255, 65, 0.4);
      --ui-font: 'Courier New', Courier, monospace;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      color: var(--text-green);
      font-family: var(--ui-font);
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    * { box-sizing: border-box; }

    #metro-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding-top: env(safe-area-inset-top); 
    }

    #metro-btn {
      display: block;
      background: rgba(2, 5, 2, 0.8);
      color: var(--text-green);
      border: 1px solid var(--border-green);
      padding: 12px 20px;
      margin: 15px auto;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      box-shadow: var(--glow);
      backdrop-filter: blur(4px);
    }

    #metro-btn:active { background: var(--border-green); color: #000; }

    #metro-menu {
      background: rgba(2, 6, 2, 0.95);
      border-bottom: 2px solid var(--border-green);
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      transform: translateY(-100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.3, 1);
      position: absolute;
      width: 100%;
      top: 0;
      box-shadow: 0 10px 30px rgba(0, 255, 65, 0.15);
      backdrop-filter: blur(8px);
    }
    #metro-menu.open {
      transform: translateY(0);
    }

    .menu-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .menu-label {
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 5px;
      opacity: 0.8;
    }

    .btn-small { padding: 5px 8px; font-size: 0.9rem; }
    .btn-large { padding: 8px 12px; font-size: 1.1rem; font-weight: bold; }
    
    .hacker-btn {
      background: rgba(0, 255, 65, 0.1);
      color: var(--text-green);
      border: 1px solid var(--border-green);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.1s;
    }
    .hacker-btn:active { background: var(--text-green); color: #000; }
    
    .bpm-display {
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: 2px solid var(--text-green);
      box-shadow: var(--glow);
      padding: 10px;
      width: 80px;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      font-family: inherit;
    }

    .hacker-select, .hacker-input {
      background: rgba(0, 0, 0, 0.8);
      color: var(--text-green);
      border: 1px solid var(--border-green);
      padding: 8px;
      font-family: inherit;
    }

    #accent-bars { display: flex; gap: 8px; }
    .accent-bar {
      width: 35px;
      height: 45px;
      border: 1px solid var(--border-green);
      background: rgba(0, 255, 65, 0.1);
      cursor: pointer;
      transition: all 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--text-green);
    }
    .accent-bar.active { 
      background: var(--sharp-pink); 
      border-color: var(--sharp-pink);
      color: #000;
      box-shadow: 0 0 10px rgba(255, 20, 147, 0.6);
    }

    #tuner-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    canvas { display: block; cursor: pointer; }

    /* Flash Effects */
    .flash-side {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40px;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }
    #flash-left { left: 0; }
    #flash-right { right: 0; }

    /* Version Display */
    #version-display {
      position: absolute;
      bottom: 8px;
      left: 8px;
      color: var(--text-green);
      font-size: 12px;
      opacity: 0.5;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Metronome Top UI -->
  <div id="metro-container">
    <div id="metro-menu">
      <div style="text-align: right; margin-bottom: 10px;">
        <span style="float:left; opacity: 0.5;">SWIPE UP TO CLOSE</span>
        <button class="hacker-btn btn-small" onclick="closeMenu()">[X] CLOSE</button>
      </div>
      
      <div class="menu-label">SPEED CONTROL</div>
      <div class="menu-row">
        <button class="hacker-btn btn-large" onclick="changeBpm(-5)">-5</button>
        <button class="hacker-btn btn-small" onclick="changeBpm(-1)">-1</button>
        <input type="number" id="bpm-input" class="bpm-display" value="120" onchange="setBpm(this.value)">
        <button class="hacker-btn btn-small" onclick="changeBpm(1)">+1</button>
        <button class="hacker-btn btn-large" onclick="changeBpm(5)">+5</button>
      </div>

      <div class="menu-label">TIME SIGNATURE & SUBDIVISIONS</div>
      <div class="menu-row">
        <button class="hacker-btn btn-small" onclick="setTimeSig(2,4)">2/4</button>
        <button class="hacker-btn btn-small" onclick="setTimeSig(3,4)">3/4</button>
        <button class="hacker-btn btn-small" onclick="setTimeSig(4,4)">4/4</button>
        <button class="hacker-btn btn-small" onclick="setTimeSig(6,8)">6/8</button>
        <input type="text" id="custom-sig" class="hacker-input" value="4/4" style="width: 60px;" onchange="parseCustomSig(this.value)">
        
        <select id="subdivision-select" class="hacker-select" onchange="setSubdivision(this.value)">
          <option value="1">No Subs</option>
          <option value="2">Eighths (2)</option>
          <option value="3">Triplets (3)</option>
          <option value="4">16ths (4)</option>
        </select>
      </div>

      <div class="menu-label">ACCENTS (Tap to toggle)</div>
      <div class="menu-row">
        <div id="accent-bars"></div>
      </div>
      
      <div class="menu-row">
        <label><input type="checkbox" id="flash-toggle" checked> Visual Edge Flash</label>
      </div>
    </div>
    
    <button id="metro-btn" onclick="toggleMetronome()">[ METRONOME: 120 BPM - OFF ]</button>
  </div>

  <!-- Edge Flashes & Version -->
  <div id="flash-left" class="flash-side"></div>
  <div id="flash-right" class="flash-side"></div>
  <div id="version-display">v1</div>

  <!-- Tuner Interface -->
  <div id="tuner-screen">
    <canvas id="orb-canvas"></canvas>
  </div>

<script>
//// --- GLOBALS ---
let audioCtx, analyser, micStream;
let isAudioInitialized = false;

// Metronome
let isPlaying = false;
let bpm = 120;
let beatsPerBar = 4;
let beatNoteValue = 4;
let accents = [true, false, false, false];
let subdivisionType = 1; 
let nextNoteTime = 0.0;
let currentBeat = 0;
let lookahead = 25.0; 
let scheduleAheadTime = 0.1; 
let timerID;

// Tuner
let tunerActive = true;
let currentNote = "";
let currentCents = 0;
let isNoteActive = false;
let perfectTuneTimer = 0;
let tunerMuteEndTime = 0;
const noteStrings = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

// Wake Lock
let wakeLock = null;

//// --- INITIALIZATION ---
function initAudio() {
  if (isAudioInitialized) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  isAudioInitialized = true;
  
  const constraints = {
    audio: {
      echoCancellation: false,
      autoGainControl: false,
      noiseSuppression: false
    }
  };

  navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
    micStream = stream;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    updatePitch();
  }).catch(err => {
    alert("Microphone access needed!\n" + err);
  });
}

async function updateWakeLock() {
  const needsWakeLock = isPlaying || tunerActive;
  
  if (needsWakeLock && !wakeLock && navigator.wakeLock) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
      });
    } catch (err) {
      console.warn(`Wake Lock error: ${err.message}`);
    }
  } else if (!needsWakeLock && wakeLock) {
    await wakeLock.release();
    wakeLock = null;
  }
}

// iOS recovery when returning from another app
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    updateWakeLock();
  }
});

document.body.addEventListener('pointerdown', () => {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: false });

//// --- METRONOME AUDIO LOGIC ---
function playClick(time, type) {
  const osc = audioCtx.createOscillator();
  const envelope = audioCtx.createGain();
  
  osc.type = 'square'; 
  
  if (type === 1) { // Accent
    osc.frequency.value = 1200;
    envelope.gain.value = 1.0; 
  } else if (type === 0) { // Normal
    osc.frequency.value = 800;
    envelope.gain.value = 0.85; 
  } else { // Subdivision 
    osc.frequency.value = 1500;
    envelope.gain.value = 0.45; 
  }

  osc.connect(envelope);
  envelope.connect(audioCtx.destination);
  
  envelope.gain.setValueAtTime(envelope.gain.value, time);
  const decayTime = (type === 2) ? 0.03 : 0.08; 
  envelope.gain.exponentialRampToValueAtTime(0.001, time + decayTime);
  
  osc.start(time);
  osc.stop(time + decayTime + 0.05);

  tunerMuteEndTime = Math.max(tunerMuteEndTime, time + decayTime + 0.15);

  if (type !== 2 && document.getElementById('flash-toggle').checked) {
    const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
    setTimeout(() => {
      const color = (type === 1) ? '255, 20, 147' : '0, 255, 65'; 
      document.getElementById('flash-left').style.background = `linear-gradient(to right, rgba(${color}, 0.7), transparent)`;
      document.getElementById('flash-right').style.background = `linear-gradient(to left, rgba(${color}, 0.7), transparent)`;
      
      document.getElementById('flash-left').style.opacity = '1';
      document.getElementById('flash-right').style.opacity = '1';
      setTimeout(() => {
        document.getElementById('flash-left').style.opacity = '0';
        document.getElementById('flash-right').style.opacity = '0';
      }, 80); 
    }, delay);
  }
}

function nextNote() {
  const secondsPerBeat = 60.0 / bpm;
  nextNoteTime += secondsPerBeat;
  currentBeat++;
  if (currentBeat >= beatsPerBar) currentBeat = 0;
}

function scheduler() {
  while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
    const isAccent = accents[currentBeat];
    playClick(nextNoteTime, isAccent ? 1 : 0);

    if (subdivisionType > 1) {
      const secPerBeat = 60.0 / bpm;
      const subInterval = secPerBeat / subdivisionType;
      for (let i = 1; i < subdivisionType; i++) {
        playClick(nextNoteTime + (i * subInterval), 2);
      }
    }
    nextNote();
  }
  timerID = setTimeout(scheduler, lookahead);
}

//// --- METRONOME UI & GESTURES ---
const metroMenu = document.getElementById('metro-menu');
const metroBtn = document.getElementById('metro-btn');

function toggleMetronome() {
  if(!isAudioInitialized) initAudio();
  isPlaying = !isPlaying;
  if (isPlaying) {
    currentBeat = 0;
    nextNoteTime = audioCtx.currentTime + 0.05;
    scheduler();
  } else {
    clearTimeout(timerID);
  }
  updateBtnText();
  updateWakeLock();
}

function updateBtnText() {
  metroBtn.innerText = `[ METRONOME: ${bpm} BPM - ${isPlaying ? 'ON' : 'OFF'} ]`;
  if (isPlaying) metroBtn.style.color = '#fff';
  else metroBtn.style.color = 'var(--text-green)';
}

function changeBpm(amount) { setBpm(parseInt(bpm) + amount); }
function setBpm(val) {
  bpm = Math.max(20, Math.min(300, parseInt(val) || 120));
  document.getElementById('bpm-input').value = bpm;
  updateBtnText();
}

function setSubdivision(val) { subdivisionType = parseInt(val); }

function renderAccentBars() {
  const container = document.getElementById('accent-bars');
  container.innerHTML = '';
  while(accents.length < beatsPerBar) accents.push(false);
  accents = accents.slice(0, beatsPerBar);

  for(let i=0; i<beatsPerBar; i++) {
    const bar = document.createElement('div');
    bar.className = 'accent-bar' + (accents[i] ? ' active' : '');
    bar.innerText = i + 1;
    bar.onclick = () => { accents[i] = !accents[i]; renderAccentBars(); };
    container.appendChild(bar);
  }
}

function setTimeSig(num, den) {
  beatsPerBar = num;
  beatNoteValue = den;
  document.getElementById('custom-sig').value = `${num}/${den}`;
  renderAccentBars();
}

function parseCustomSig(val) {
  const parts = val.split('/');
  if(parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
    setTimeSig(parseInt(parts[0]), parseInt(parts[1]));
  }
}
renderAccentBars();

let touchStartY = 0;
window.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive: true});
window.addEventListener('touchend', e => {
  const touchEndY = e.changedTouches[0].clientY;
  const deltaY = touchEndY - touchStartY;
  
  if (deltaY > 60 && !metroMenu.classList.contains('open') && touchStartY < window.innerHeight / 2) {
    metroMenu.classList.add('open');
  } else if (deltaY < -60 && metroMenu.classList.contains('open')) {
    metroMenu.classList.remove('open');
  }
});
function closeMenu() { metroMenu.classList.remove('open'); }

//// --- TUNER LOGIC ---
function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  
  if (rms < 0.002) return -1; 

  let r1 = 0, r2 = SIZE - 1, thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
  buf = buf.slice(r1, r2);
  SIZE = buf.length;

  let c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE - i; j++) c[i] = c[i] + buf[j] * buf[j + i];
  }

  let d = 0; while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < SIZE; i++) {
    if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
  }
  let T0 = maxpos;
  let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
  let a = (x1 + x3 - 2 * x2) / 2;
  let b = (x3 - x1) / 2;
  if (a) T0 = T0 - b / (2 * a);
  return sampleRate / T0;
}

function updatePitch() {
  requestAnimationFrame(updatePitch);
  if (!tunerActive || !analyser) return; 

  if (audioCtx.currentTime < tunerMuteEndTime) {
    return; 
  }

  const buf = new Float32Array(2048);
  analyser.getFloatTimeDomainData(buf);
  const freq = autoCorrelate(buf, audioCtx.sampleRate);
  
  if (freq === -1) {
    isNoteActive = false;
  } else {
    isNoteActive = true;
    const noteNum = Math.round(12 * (Math.log(freq / 440) / Math.log(2))) + 69;
    const expectedFreq = 440 * Math.pow(2, (noteNum - 69) / 12);
    currentNote = noteStrings[noteNum % 12];
    currentCents = Math.floor(1200 * Math.log(freq / expectedFreq) / Math.log(2));
  }
}

//// --- CANVAS RENDER (The Orb) ---
const canvas = document.getElementById('orb-canvas');
const ctx = canvas.getContext('2d');
let cw, ch;

function resize() {
  cw = canvas.width = window.innerWidth;
  ch = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Tap canvas to toggle tuner
canvas.addEventListener('click', () => {
  if (!isAudioInitialized) initAudio();
  tunerActive = !tunerActive;
  isNoteActive = false; 
  updateWakeLock();
});

function drawOrb() {
  requestAnimationFrame(drawOrb);
  ctx.clearRect(0, 0, cw, ch);
  
  const cx = cw / 2;
  const cy = ch / 2;
  const baseRadius = Math.min(cw, ch) * 0.35; 
  
  if (!tunerActive) {
    ctx.beginPath(); ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
    ctx.strokeStyle = '#333'; ctx.lineWidth = 10; ctx.stroke();
    
    // Dynamic size for paused text
    const pauseSize = baseRadius * 0.35;
    ctx.font = `bold ${pauseSize}px var(--ui-font)`; 
    ctx.fillStyle = '#666';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText("PAUSED", cx, cy - (pauseSize * 0.2));
    
    ctx.font = `${pauseSize * 0.4}px var(--ui-font)`; 
    ctx.fillText("(Tap to resume)", cx, cy + (pauseSize * 0.8));
    return;
  }

  if (!isNoteActive) {
    ctx.beginPath(); ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
    ctx.strokeStyle = '#052205'; ctx.lineWidth = 10; ctx.stroke();
    
    // Dynamic size for listening text
    const listenSize = baseRadius * 0.3;
    ctx.font = `bold ${listenSize}px var(--ui-font)`; 
    ctx.fillStyle = '#005511';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText("LISTENING...", cx, cy);
    
    perfectTuneTimer = 0;
    return;
  }

  let t = Math.min(1, Math.abs(currentCents) / 50); 
  
  ctx.beginPath(); ctx.arc(cx, cy, baseRadius, Math.PI, 0);
  ctx.lineWidth = 25; ctx.strokeStyle = (currentCents > 2) ? `rgba(255, 20, 147, ${t + 0.2})` : '#052205';
  ctx.stroke();

  ctx.beginPath(); ctx.arc(cx, cy, baseRadius, 0, Math.PI);
  ctx.lineWidth = 25; ctx.strokeStyle = (currentCents < -2) ? `rgba(255, 140, 0, ${t + 0.2})` : '#052205';
  ctx.stroke();
  
  if (Math.abs(currentCents) <= 3) {
    ctx.beginPath(); ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
    ctx.lineWidth = 25; ctx.strokeStyle = '#00ff41'; ctx.stroke();
    
    const pulse = baseRadius + (Math.sin(Date.now() / 100) * 10) + 15;
    ctx.beginPath(); ctx.arc(cx, cy, pulse, 0, Math.PI*2);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0, 255, 65, 0.5)'; ctx.stroke();
  }

  // MASSIVE Note Text (Dynamic sizing based on radius)
  const fontSize = baseRadius * 2.5; 
  ctx.font = `bold ${fontSize}px var(--ui-font)`;
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(currentNote, cx, cy + (fontSize * 0.05));
  
  const centSize = baseRadius * 0.3;
  ctx.font = `${centSize}px var(--ui-font)`;
  let centText = (currentCents > 0 ? "+" : "") + currentCents + "c";
  ctx.fillStyle = (Math.abs(currentCents) <= 3) ? '#00ff41' : '#aaa';
  ctx.fillText(centText, cx, cy + (baseRadius * 0.80));
}
drawOrb();

</script>
</body>
</html>
